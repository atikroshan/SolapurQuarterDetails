<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b3a82" />
<title>Solapur Division — Quarter Details</title>
<style>
:root{
  --rb:#0b3a82; --rb-dark:#072a60; --rb-mid:#1559b8; --rb-soft:#e8f0fb;
  --bg:#f2f5fa; --card:#fff; --ink:#0f1f3d; --dim:#5d6b85; --line:#dbe3f0;
  --occ:#1b7f4b; --occ-bg:#e9f7ef; --occ-line:#a9dcc0;
  --vac:#c62828; --vac-bg:#fdeeee; --vac-line:#f3b9b9;
  --gold:#f5b400;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh;padding-bottom:90px}

/* ---------- Header ---------- */
.hero{background:linear-gradient(180deg,var(--rb) 0%,var(--rb-dark) 100%);color:#fff;padding:env(safe-area-inset-top,0) 16px 64px;position:relative}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--gold)}
.hero-in{max-width:560px;margin:0 auto;padding-top:14px}
.hero-row{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;background:#fff;color:var(--rb);display:grid;place-items:center;flex-shrink:0}
.logo svg{width:26px;height:26px}
.hero h1{font-size:.86rem;font-weight:750;line-height:1.35;letter-spacing:.02em}
.hero p{font-size:.76rem;color:#bcd0ee;margin-top:3px;line-height:1.35}
.live{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:700;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);padding:4px 9px;border-radius:999px;flex-shrink:0}
.live i{width:7px;height:7px;border-radius:50%;background:#4ade80;animation:p 1.6s infinite}
@keyframes p{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.live i{animation:none}}

/* ---------- Layout ---------- */
.wrap{max-width:560px;margin:-46px auto 0;padding:0 14px;position:relative}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:14px;padding:11px 12px;border:1px solid var(--line);border-top:4px solid var(--rb);box-shadow:0 4px 14px rgba(11,58,130,.12)}
.kpi.o{border-top-color:var(--occ)} .kpi.v{border-top-color:var(--vac)}
.kpi span{display:block;font-size:.72rem;color:var(--dim);font-weight:600}
.kpi b{font-size:1.5rem;font-variant-numeric:tabular-nums}
.kpi.o b{color:var(--occ)} .kpi.v b{color:var(--vac)} .kpi.t b{color:var(--rb)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.panel input[type=search]{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:.9rem;background:var(--bg);color:var(--ink);outline:none}
.panel input:focus,.panel select:focus{border-color:var(--rb-mid);box-shadow:0 0 0 3px rgba(21,89,184,.15)}
.sel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-size:.8rem;font-weight:600;background:var(--bg);color:var(--ink);outline:none}
.reset{border:1.5px solid var(--rb);background:var(--rb-soft);color:var(--rb);border-radius:10px;font-weight:700;font-size:.8rem;padding:10px;cursor:pointer}
.reset:active{background:var(--rb);color:#fff}

.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--dim);border-radius:999px;padding:7px 14px;font-size:.78rem;font-weight:700;white-space:nowrap;cursor:pointer}
.chip.active{background:var(--rb);border-color:var(--rb);color:#fff}
.chip[data-status=Occupied].active{background:var(--occ);border-color:var(--occ)}
.chip[data-status=Vacant].active{background:var(--vac);border-color:var(--vac)}

.note{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.76rem;color:var(--dim);margin:0 2px 10px}
.note.err{color:#c62828;background:#fdeeee;border:1px solid #f3b9b9;padding:9px 12px;border-radius:10px}

/* ---------- Building cards ---------- */
.list{display:flex;flex-direction:column;gap:12px}
.bldg{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(11,58,130,.06)}
.bh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 14px;background:var(--rb-soft);border-bottom:1px solid var(--line)}
.bt{font-size:.92rem;font-weight:750;color:var(--rb-dark)}
.bs{font-size:.73rem;color:var(--dim);margin-top:2px}
.bb{display:flex;gap:6px;font-size:.7rem;font-weight:700;flex-shrink:0}
.bb .o{background:var(--occ);color:#fff;padding:3px 8px;border-radius:999px}
.bb .v{background:var(--vac);color:#fff;padding:3px 8px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;padding:12px}
.tile{text-align:left;border-radius:12px;padding:10px 11px;min-height:88px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;border:1px solid;border-left-width:5px;font:inherit;color:inherit}
.tile:active{transform:scale(.97)}
.tile.occupied{background:var(--occ-bg);border-color:var(--occ-line);border-left-color:var(--occ)}
.tile.vacant{background:var(--vac-bg);border-color:var(--vac-line);border-left-color:var(--vac)}
.tile.sel{outline:2.5px solid var(--rb-mid);outline-offset:1px}
.qn{font-size:.86rem;font-weight:800;color:var(--ink)}
.qf{font-size:.7rem;color:var(--dim);margin-top:2px}
.qp{font-size:.78rem;font-weight:650;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qd{font-size:.68rem;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.occupied .qd{color:var(--occ)} .tile.vacant .qd{color:var(--vac)}
.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:30px 16px;text-align:center;color:var(--dim);font-size:.88rem}

/* ---------- Detail sheet ---------- */
.back{display:none;position:fixed;inset:0;background:rgba(7,20,45,.35);z-index:45}
.back.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;height:50dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:#fff;border-radius:20px 20px 0 0;z-index:50;transform:translateY(105%);transition:transform .3s cubic-bezier(.22,1,.36,1);box-shadow:0 -10px 30px rgba(0,0,0,.3);touch-action:none}
.sheet.open{transform:none}
.top.occupied{background:var(--occ)}
.top.vacant{background:var(--vac)}
.sheet.occupied .call{background:var(--occ)}
.sheet.vacant .call{background:var(--vac)}
.handle{width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.55);margin:0 auto 10px}
.top{background:var(--rb);color:#fff;border-radius:20px 20px 0 0;padding:9px 18px 12px;flex-shrink:0}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{background:rgba(255,255,255,.18);border:0;color:#fff;width:30px;height:30px;border-radius:50%;font-size:1rem;cursor:pointer;flex-shrink:0}
.sh h2{font-size:.98rem;font-weight:750}
.badge{font-size:.72rem;font-weight:800;padding:4px 11px;border-radius:999px;background:#fff}
.badge.occupied{color:var(--occ)} .badge.vacant{color:var(--vac)}
.rows{padding:6px 18px calc(18px + env(safe-area-inset-bottom,0));overflow-y:auto;flex:1;touch-action:pan-y}
.row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.84rem}
.row:last-child{border:0}
.row .l{color:var(--dim);flex-shrink:0}
.row .r{font-weight:650;text-align:right;word-break:break-word}
.call{display:inline-block;background:var(--rb);color:#fff;text-decoration:none;font-weight:700;padding:5px 12px;border-radius:999px}

/* ---------- Dock ---------- */
.dock{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0));z-index:25;background:var(--rb-dark);color:#fff;border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;font-size:.76rem;box-shadow:0 8px 22px rgba(7,42,96,.4)}
.dock b{color:var(--gold);font-weight:700;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock{max-width:536px;margin:0 auto}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-in">
    <div class="hero-row">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M9 21l2-4M15 21l-2-4"/><circle cx="9" cy="14" r=".6"/><circle cx="15" cy="14" r=".6"/></svg>
      </div>
      <div style="min-width:0">
        <h1>SOLAPUR DIVISION QUARTER DETAILS (DUDHANI TO WADSINGE) SSE WORKS OFFICE, SOLAPUR</h1>
      </div>
      <span class="live"><i></i>LIVE</span>
    </div>
  </div>
</header>

<div class="wrap">
  <main>
    <div class="kpis">
      <div class="kpi t"><span>Total</span><b id="kTotal">0</b></div>
      <div class="kpi o"><span>Occupied</span><b id="kOcc">0</b></div>
      <div class="kpi v"><span>Vacant</span><b id="kVac">0</b></div>
    </div>

    <div class="panel">
      <input type="search" id="qSearch" placeholder="Search name, quarter, HRMS, mobile, dept" />
      <div class="sel">
        <select id="qStation" aria-label="Station"><option value="all">All Stations</option></select>
        <select id="qColony" aria-label="Colony"><option value="all">All Colonies</option></select>
      </div>
      <div class="chips" id="statusChips">
        <button type="button" class="chip active" data-status="all">All quarters</button>
        <button type="button" class="chip" data-status="Occupied">Occupied</button>
        <button type="button" class="chip" data-status="Vacant">Vacant</button>
      </div>
      <div class="sel" style="margin-top:10px">
        <select id="qDept" aria-label="Department"><option value="all">All Departments</option></select>
        <select id="qBldg" aria-label="Building No."><option value="all">All Buildings</option></select>
        <select id="qType" aria-label="Quarter Type"><option value="all">All Quarter Types</option></select>
        <select id="qNo" aria-label="Quarter Number"><option value="all">All Quarter Nos.</option></select>
        <select id="qFloor" aria-label="Floor"><option value="all">All Floors</option></select>
        <button type="button" class="reset" id="resetBtn">Reset filters</button>
      </div>
    </div>

    <div class="note" id="noteBar"><span id="noteMsg">Loading data…</span><span id="scopeSummary">All Stations</span></div>
    <div class="list" id="blocksList"></div>
  </main>

  <div class="back" id="sheetBackdrop"></div>
  <aside class="sheet" id="detailSheet">
    <div class="top" id="sheetTop">
      <div class="handle"></div>
      <div class="sh"><h2 id="sTitle">Quarter Details</h2><span class="badge vacant" id="sBadge">—</span><button type="button" class="x" id="sClose" aria-label="Close">✕</button></div>
    </div>
    <div class="rows" id="sBody"><div class="row"><span class="l">Info</span><span class="r">Tap any quarter</span></div></div>
  </aside>
</div>

<div class="dock">
  <span id="dockSync">Last sync: —</span>
  <b id="dockActive">Tap a quarter for details</b>
</div>

<script>
const ENDPOINT_URL = "https://script.google.com/macros/s/AKfycby1rZViYfAP9UlVifc2eKAx0VFaX2ehUGfZ-_SBq8H2jN4oiyB8kYg8qZTtcboXrAts5g/exec";
const AUTO_POLL_SEC = 60;
let records = [], selectedSr = null, statusFilter = "all";
const $ = id => document.getElementById(id);
const kTotal=$("kTotal"),kOcc=$("kOcc"),kVac=$("kVac"),noteBar=$("noteBar"),noteMsg=$("noteMsg"),scopeSummary=$("scopeSummary"),
 dockSync=$("dockSync"),dockActive=$("dockActive"),qSearch=$("qSearch"),qStation=$("qStation"),qColony=$("qColony"),qFloor=$("qFloor"),
 resetBtn=$("resetBtn"),blocksList=$("blocksList"),sheetBackdrop=$("sheetBackdrop"),detailSheet=$("detailSheet"),
 sTitle=$("sTitle"),sBadge=$("sBadge"),sBody=$("sBody");

const qDept=$("qDept"),qBldg=$("qBldg"),qType=$("qType"),qNo=$("qNo");
function openMobileSheet(){ sheetBackdrop.classList.add("open");detailSheet.classList.add("open");detailSheet.style.transform=""; $("sBody").scrollTop=0; }
function closeMobileSheet(){ sheetBackdrop.classList.remove("open");detailSheet.classList.remove("open"); }
sheetBackdrop.addEventListener("click", closeMobileSheet);
$("sClose").addEventListener("click", closeMobileSheet);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMobileSheet();});
// swipe down on the blue header to close
(()=>{let y0=null,dy=0;const top=$("sheetTop");
 top.addEventListener("touchstart",e=>{y0=e.touches[0].clientY;dy=0;detailSheet.style.transition="none";},{passive:true});
 top.addEventListener("touchmove",e=>{if(y0===null)return;dy=Math.max(0,e.touches[0].clientY-y0);detailSheet.style.transform=`translateY(${dy}px)`;},{passive:true});
 top.addEventListener("touchend",()=>{if(y0===null)return;detailSheet.style.transition="";detailSheet.style.transform="";if(dy>80)closeMobileSheet();y0=null;});
})();

function normalizeRecord(raw, idx){
  const pick=(...keys)=>{for(const k of keys){if(raw[k]!==undefined&&raw[k]!==null&&String(raw[k]).trim()!=="")return String(raw[k]).trim();}return "";};
  const stRaw=pick("status","Quarter Status","quarterStatus").toLowerCase();
  return {
    sr:Number(pick("sr","Sr. No.","srNo"))||(idx+1),
    name:pick("name","Employee Name","employeeName"),
    hrms:pick("hrms","HRMS ID","hrmsId"),
    mobile:pick("mobile","Mobile No.","mobileNo"),
    pf:pick("pf","PF No.","pfNo"),
    station:pick("station","Station"),
    colony:pick("colony","Colony"),
    dept:pick("dept","Department"),
    bldg:pick("bldg","Building No.","buildingNo"),
    qType:pick("qType","Quarter Type","quarterType"),
    qNo:pick("qNo","Quarter Number","quarterNo"),
    floor:pick("floor","Floor"),
    area:pick("area","Plinth Area (Sqm)","plinthArea"),
    status:stRaw.includes("vac")?"Vacant":"Occupied",
    date:pick("date","Occupied / Vacant Date","occVacDate"),
    remark:pick("remark","Remark")
  };
}

function floorRank(s){
  const f=(s||"").toLowerCase();
  if(f.includes("ground")||f==="g"||f==="gf")return 0;
  if(f.includes("1st")||f.includes("first")||f==="1")return 1;
  if(f.includes("2nd")||f.includes("second")||f==="2")return 2;
  if(f.includes("3rd")||f.includes("third")||f==="3")return 3;
  return 9;
}

async function fetchSheet(){
  try{
    noteBar.classList.remove("err");
    noteMsg.textContent="Syncing live data…";
    const res=await fetch(`${ENDPOINT_URL}?_=${Date.now()}`);
    if(!res.ok)throw new Error(`HTTP ${res.status}`);
    const data=await res.json();
    if(data.error)throw new Error(data.error);
    const list=Array.isArray(data)?data:(data.records||data.data||[]);
    records=list.map(normalizeRecord);
    syncDropdowns();
    if(!selectedSr&&records.length)selectedSr=records[0].sr;
    renderBoard();renderDetail();
    dockSync.textContent="Synced "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    noteMsg.textContent=`Live feed connected · ${records.length} quarters`;
  }catch(err){
    noteBar.classList.add("err");
    noteMsg.textContent=`Sync failed: ${err.message}. Check your connection and try again.`;
    dockSync.textContent="Sync error";
  }
}

const FILTERS=[
 {el:qStation,key:"station",all:"Stations",none:"Unspecified Station"},
 {el:qColony,key:"colony",all:"Colonies",none:"Unspecified Colony"},
 {el:qDept,key:"dept",all:"Departments",none:"Unspecified"},
 {el:qBldg,key:"bldg",all:"Buildings",none:"Unspecified"},
 {el:qType,key:"qType",all:"Quarter Types",none:"Unspecified"},
 {el:qNo,key:"qNo",all:"Quarter Nos.",none:"Unspecified"},
 {el:qFloor,key:"floor",all:"Floors",none:"Unspecified Floor"}
];
const fval=(r,f)=>r[f.key]||f.none;
const passes=(r,skip)=>FILTERS.every(f=>f===skip||f.el.value==="all"||fval(r,f)===f.el.value);

function syncDropdowns(){
  for(let pass=0;pass<3;pass++){
    let changed=false;
    for(const f of FILTERS){
      const prev=f.el.value,m=new Map();
      for(const r of records){if(!passes(r,f))continue;const v=fval(r,f);m.set(v,(m.get(v)||0)+1);}
      const keys=[...m.keys()].sort(f.key==="floor"?(a,b)=>floorRank(a)-floorRank(b)||a.localeCompare(b):(a,b)=>a.localeCompare(b,undefined,{numeric:true}));
      f.el.innerHTML=`<option value="all">All ${f.all}</option>`+keys.map(k=>`<option value="${escAttr(k)}">${escHtml(k)}</option>`).join("");
      const next=m.has(prev)?prev:"all";
      f.el.value=next;
      if(next!==prev)changed=true;
    }
    if(!changed)break;
  }
}
const inLocation=r=>passes(r,null);
function matches(r){
  if(!inLocation(r))return false;
  if(statusFilter!=="all"&&r.status!==statusFilter)return false;
  const t=qSearch.value.trim().toLowerCase();
  if(!t)return true;
  return `${r.name} ${r.qNo} ${r.hrms} ${r.pf} ${r.mobile} ${r.dept} ${r.colony} ${r.station} ${r.bldg} ${r.floor}`.toLowerCase().includes(t);
}

function renderBoard(){
  const scoped=records.filter(inLocation);
  const occ=scoped.filter(r=>r.status==="Occupied").length;
  kTotal.textContent=scoped.length;kOcc.textContent=occ;kVac.textContent=scoped.length-occ;
  const filtered=records.filter(matches);
  const parts=FILTERS.map(f=>f.el).filter(e=>e.value!=="all").map(e=>e.value);
  scopeSummary.textContent=`${parts.length?parts.join(" › "):"All Stations"} · ${filtered.length} shown`;
  if(!filtered.length){blocksList.innerHTML=`<div class="empty">No quarters match. Clear a filter or change the search.</div>`;return;}

  const groups=new Map();
  for(const r of filtered){
    const key=`${r.station}|${r.colony}|${r.bldg}`;
    if(!groups.has(key))groups.set(key,{station:r.station,colony:r.colony,bldg:r.bldg,items:[]});
    groups.get(key).items.push(r);
  }
  const frag=document.createDocumentFragment();
  groups.forEach(g=>{
    const gO=g.items.filter(x=>x.status==="Occupied").length;
    const card=document.createElement("section");
    card.className="bldg";
    card.innerHTML=`<div class="bh"><div style="min-width:0"><div class="bt">${escHtml(g.colony||"Colony")} · Bldg ${escHtml(g.bldg||"-")}</div><div class="bs">${escHtml(g.station||"Station")} · ${g.items.length} quarters</div></div><div class="bb"><span class="o">${gO} Occ</span><span class="v">${g.items.length-gO} Vac</span></div></div><div class="grid"></div>`;
    const grid=card.querySelector(".grid");
    g.items.forEach(r=>{
      const isO=r.status==="Occupied";
      const t=document.createElement("button");
      t.type="button";
      t.className=`tile ${isO?"occupied":"vacant"}${r.sr===selectedSr?" sel":""}`;
      t.innerHTML=`<div><div class="qn">Qtr ${escHtml(r.qNo||r.sr)}</div><div class="qf">${escHtml(r.floor||"-")} · ${escHtml(r.qType||"")}</div></div><div><div class="qp">${isO?escHtml(r.name||"Occupied"):"Vacant"}</div><div class="qd">${isO?escHtml(r.dept||"Occupied"):escHtml(r.dept||"Available")}</div></div>`;
      t.addEventListener("click",()=>{selectedSr=r.sr;renderBoard();renderDetail();openMobileSheet();});
      grid.appendChild(t);
    });
    frag.appendChild(card);
  });
  blocksList.innerHTML="";blocksList.appendChild(frag);
}

function renderDetail(){
  const r=records.find(x=>x.sr===selectedSr);
  if(!r)return;
  const isO=r.status==="Occupied";
  sTitle.textContent=`Quarter ${r.qNo||r.sr} (${r.qType||"Unit"})`;
  sBadge.textContent=r.status;
  sBadge.className=`badge ${isO?"occupied":"vacant"}`;
  $("sheetTop").className=`top ${isO?"occupied":"vacant"}`;
  detailSheet.classList.toggle("occupied",isO);detailSheet.classList.toggle("vacant",!isO);
  dockActive.textContent=`Qtr ${r.qNo||r.sr}: ${r.status}${isO&&r.name?" · "+r.name:""}`;
  const ph=(r.mobile||"").replace(/[^0-9+]/g,"");
  const phoneHtml=ph&&r.mobile.toLowerCase()!=="nil"?`<a class="call" href="tel:${escAttr(ph)}">Call ${escHtml(r.mobile)}</a>`:escHtml(r.mobile||"—");
  const pairs=[["Resident",escHtml(r.name||"—")],["Department",escHtml(r.dept||"—")],["Station",escHtml(r.station||"—")],["Colony",escHtml(r.colony||"—")],["Building No.",escHtml(r.bldg||"—")],["Floor",escHtml(r.floor||"—")],["Plinth Area",escHtml(r.area||"—")],["HRMS ID",escHtml(r.hrms||"—")],["PF No.",escHtml(r.pf||"—")],["Mobile No.",phoneHtml],["Occ / Vac Date",escHtml(r.date||"—")],["Remark",escHtml(r.remark||"—")]];
  sBody.innerHTML=pairs.map(([k,v])=>`<div class="row"><span class="l">${escHtml(k)}</span><span class="r">${v}</span></div>`).join("");
}

function escHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function escAttr(s){return escHtml(s).replace(/'/g,"&#39;");}

FILTERS.forEach(f=>f.el.addEventListener("change",()=>{syncDropdowns();renderBoard();}));
qSearch.addEventListener("input",renderBoard);
document.querySelectorAll("#statusChips .chip").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("#statusChips .chip").forEach(c=>c.classList.remove("active"));
  b.classList.add("active");statusFilter=b.dataset.status;renderBoard();
}));
resetBtn.addEventListener("click",()=>{
  qSearch.value="";FILTERS.forEach(f=>f.el.value="all");statusFilter="all";
  document.querySelectorAll("#statusChips .chip").forEach(c=>c.classList.toggle("active",c.dataset.status==="all"));
  syncDropdowns();renderBoard();
});

fetchSheet();
setInterval(fetchSheet,AUTO_POLL_SEC*1000);
</script>
</body>
</html>
