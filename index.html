<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b3a82" />
<title>Solapur Division — Quarter Details</title>
<style>
:root{
  --rb:#0b3a82; --rb-dark:#072a60; --rb-mid:#1559b8; --rb-soft:#e8f0fb;
  --bg:#f2f5fa; --card:#fff; --ink:#0f1f3d; --dim:#5d6b85; --line:#dbe3f0;
  --occ:#1b7f4b; --occ-bg:#e9f7ef; --occ-line:#a9dcc0;
  --vac:#c62828; --vac-bg:#fdeeee; --vac-line:#f3b9b9;
  --gold:#f5b400;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh;padding-bottom:28px}

/* ---------- Header ---------- */
.hero{background:linear-gradient(180deg,var(--rb) 0%,var(--rb-dark) 100%);color:#fff;padding:env(safe-area-inset-top,0) 16px 64px;position:relative}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--gold)}
.hero-in{max-width:560px;margin:0 auto;padding-top:14px}
.hero-row{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:50%;background:#fff;border:2px solid #fff;overflow:hidden;flex-shrink:0}
.logo img{width:100%;height:100%;display:block;object-fit:cover}
.hero h1{min-width:0;overflow-wrap:anywhere;font-size:.86rem;font-weight:750;line-height:1.35;letter-spacing:.02em}
.hero p{font-size:.76rem;color:#bcd0ee;margin-top:3px;line-height:1.35}
.live{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:700;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);padding:4px 9px;border-radius:999px;flex-shrink:0}
.live i{width:7px;height:7px;border-radius:50%;background:#4ade80;animation:p 1.6s infinite}
@keyframes p{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.live i{animation:none}}

/* ---------- Layout ---------- */
.wrap{max-width:560px;margin:-46px auto 0;padding:0 14px;position:relative}

.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:14px;padding:11px 12px;border:1px solid var(--line);border-top:4px solid var(--rb);box-shadow:0 4px 14px rgba(11,58,130,.12)}
.kpi.o{border-top-color:var(--occ)} .kpi.v{border-top-color:var(--vac)}
.kpi span{display:block;font-size:.72rem;color:var(--dim);font-weight:600}
.kpi b{font-size:1.5rem;font-variant-numeric:tabular-nums}
.kpi.o b{color:var(--occ)} .kpi.v b{color:var(--vac)} .kpi.t b{color:var(--rb)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.panel input[type=search]{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:.9rem;background:var(--bg);color:var(--ink);outline:none}
.panel input:focus,.panel select:focus{border-color:var(--rb-mid);box-shadow:0 0 0 3px rgba(21,89,184,.15)}
.sel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-size:.8rem;font-weight:600;background:var(--bg);color:var(--ink);outline:none}
.reset{border:1.5px solid var(--rb);background:var(--rb-soft);color:var(--rb);border-radius:10px;font-weight:700;font-size:.8rem;padding:10px;cursor:pointer}
.reset:active{background:var(--rb);color:#fff}

.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--dim);border-radius:999px;padding:7px 14px;font-size:.78rem;font-weight:700;white-space:nowrap;cursor:pointer}
.chip.active{background:var(--rb);border-color:var(--rb);color:#fff}
.chip[data-status=Occupied].active{background:var(--occ);border-color:var(--occ)}
.chip[data-status=Vacant].active{background:var(--vac);border-color:var(--vac)}

.note{display:none;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.76rem;color:var(--dim);margin:0 2px 10px}
.note.err{display:flex;color:#c62828;background:#fdeeee;border:1px solid #f3b9b9;padding:9px 12px;border-radius:10px}

/* ---------- Building cards ---------- */
.list{display:flex;flex-direction:column;gap:12px;min-width:0}
.bldg{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(11,58,130,.06)}
.bh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 14px;background:var(--rb-soft);border-bottom:1px solid var(--line)}
.bt{font-size:.92rem;font-weight:750;color:var(--rb-dark)}
.bs{font-size:.73rem;color:var(--dim);margin-top:2px}
.bb{display:flex;gap:6px;font-size:.7rem;font-weight:700;flex-shrink:0}
.bb .o{background:var(--occ);color:#fff;padding:3px 8px;border-radius:999px}
.bb .v{background:var(--vac);color:#fff;padding:3px 8px;border-radius:999px}
.grid{display:flex;flex-wrap:wrap;gap:9px;padding:12px}
.tile{flex:0 0 calc(50% - 4.5px);width:calc(50% - 4.5px);max-width:calc(50% - 4.5px);min-width:0;overflow:hidden;text-align:left;border-radius:12px;padding:10px 11px;min-height:88px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;border:1px solid;border-left-width:5px;font:inherit;color:inherit}
.tile:active{transform:scale(.97)}
.tile.occupied{background:var(--occ-bg);border-color:var(--occ-line);border-left-color:var(--occ)}
.tile.vacant{background:var(--vac-bg);border-color:var(--vac-line);border-left-color:var(--vac)}
.tile.sel{outline:2.5px solid var(--rb-mid);outline-offset:1px}
.tile>div{width:100%;min-width:0}
.qn,.qf{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qn{font-size:.86rem;font-weight:800;color:var(--ink)}
.qf{font-size:.7rem;color:var(--dim);margin-top:2px}
.qp{font-size:.78rem;font-weight:650;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qd{font-size:.68rem;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.occupied .qd{color:var(--occ)} .tile.vacant .qd{color:var(--vac)}
.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:30px 16px;text-align:center;color:var(--dim);font-size:.88rem}

/* ---------- Detail sheet ---------- */
.back{display:none;position:fixed;inset:0;background:rgba(7,20,45,.35);z-index:45}
.back.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;height:64dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:#fff;border-radius:20px 20px 0 0;z-index:50;transform:translateY(105%);transition:transform .3s cubic-bezier(.22,1,.36,1);box-shadow:0 -10px 30px rgba(0,0,0,.3);touch-action:none}
.sheet.open{transform:none}
.top.occupied{background:var(--occ)}
.top.vacant{background:var(--vac)}
.sheet.occupied .call{background:var(--occ)}
.sheet.vacant .call{background:var(--vac)}
.handle{width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.55);margin:0 auto 10px}
.top{background:var(--rb);color:#fff;border-radius:20px 20px 0 0;padding:9px 18px 12px;flex-shrink:0}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{background:rgba(255,255,255,.18);border:0;color:#fff;width:30px;height:30px;border-radius:50%;font-size:1rem;cursor:pointer;flex-shrink:0}
.sh h2{font-size:.98rem;font-weight:750}
.badge{font-size:.72rem;font-weight:800;padding:4px 11px;border-radius:999px;background:#fff}
.badge.occupied{color:var(--occ)} .badge.vacant{color:var(--vac)}
.rows{padding:2px 18px calc(12px + env(safe-area-inset-bottom,0));overflow-y:auto;flex:1;touch-action:pan-y}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.82rem}
.row:last-child{border:0}
.row .l{color:var(--dim);flex-shrink:0}
.row .r{font-weight:650;text-align:right;word-break:break-word}
.call{display:inline-block;background:var(--rb);color:#fff;text-decoration:none;font-weight:700;padding:5px 12px;border-radius:999px}

/* ---------- Dock ---------- */

/* ---------- Gate (splash + NORTH/SOUTH) ---------- */
#gate{touch-action:none;position:fixed;inset:0;z-index:100;background:linear-gradient(180deg,var(--rb-mid) 0%,var(--rb) 45%,var(--rb-dark) 100%);display:flex;align-items:center;justify-content:center;padding:24px}
#gCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#gate.gone{opacity:0;visibility:hidden;pointer-events:none}
.g-in{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;color:#fff;width:100%;max-width:min(100%,440px)}
.g-logo{width:116px;height:116px;border-radius:50%;background:#fff;border:3px solid #fff;object-fit:cover;animation:gin .8s ease both,beat 4.5s ease-in-out 1s infinite}
@keyframes beat{
  0%,100%{transform:scale(1)}
  14%{transform:scale(1.07)}
  28%{transform:scale(1)}
  42%{transform:scale(1.05)}
  62%{transform:scale(1)}
}
@keyframes gin{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.g-rest{width:100%;max-height:0;overflow:hidden;transition:max-height .9s cubic-bezier(.22,1,.36,1)}
#gate.show-title .g-rest{max-height:460px}
.g-title{margin-top:20px;font-size:23px;font-weight:800;letter-spacing:.04em;line-height:1.35;text-shadow:-1.5px -1.5px 0 #05204f,1.5px -1.5px 0 #05204f,-1.5px 1.5px 0 #05204f,1.5px 1.5px 0 #05204f,0px -2px 0 #05204f,0px 2px 0 #05204f,-2px 0px 0 #05204f,2px 0px 0 #05204f,0 3px 8px rgba(0,0,0,.45);opacity:0;transform:translateY(60px);transition:opacity .8s ease .15s,transform .9s cubic-bezier(.22,1,.36,1) .15s}
#gate.show-title .g-title{opacity:1;transform:none}
.g-btns{margin-top:30px;width:100%;display:flex;flex-direction:column;gap:12px;opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}
#gate.ready .g-btns{opacity:1;visibility:visible;transform:none}
.g-btns{gap:16px}
.g-btns button{position:relative;overflow:visible;width:100%;min-height:54px;font-family:inherit;font-size:1.02rem;font-weight:800;letter-spacing:.22em;color:var(--rb-dark);background:#fff;border:1.5px solid #cfe0f7;border-radius:14px;cursor:pointer;user-select:none;box-shadow:0 2px 8px rgba(0,0,0,.18);transition:transform .12s ease,background-color .12s ease}
.g-btns button:active{transform:scale(.97);background:var(--rb-soft)}
.g-btns button::after{content:'';position:absolute;inset:-2px;border-radius:16px;border:2px solid #fff;opacity:0;pointer-events:none}
.g-btns button.pulse::after{animation:ring-out .45s cubic-bezier(.2,.8,.2,1)}
@keyframes ring-out{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.07,1.3);opacity:0}}
#gate.ready .g-rest{overflow:visible}
@media(prefers-reduced-motion:reduce){.g-logo{animation:none}.g-rest,.g-title,.g-btns{transition:none}}
button.live{color:#fff;font-family:inherit;cursor:pointer}

/* ---------- 3D hinge swing door transition ---------- */
#stage.swinging{position:fixed;inset:0;height:100dvh;overflow:hidden;z-index:110;background:var(--bg);transform-origin:left center;backface-visibility:hidden;will-change:transform,opacity}
#stage.swing-in-next{animation:swingInNext .55s cubic-bezier(.22,1,.36,1) forwards;box-shadow:12px 0 30px rgba(0,0,0,.45)}
#stage.swing-out-prev{animation:swingOutPrev .55s cubic-bezier(.22,1,.36,1) forwards;box-shadow:12px 0 30px rgba(0,0,0,.45)}
#gate.swing-out-next{animation:gateOutNext .55s cubic-bezier(.22,1,.36,1) forwards}
#gate.swing-in-prev{animation:gateInPrev .55s cubic-bezier(.22,1,.36,1) both}
@keyframes swingInNext{from{transform:perspective(1200px) rotateY(-85deg);opacity:0}to{transform:perspective(1200px) rotateY(0);opacity:1}}
@keyframes swingOutPrev{from{transform:perspective(1200px) rotateY(0);opacity:1}to{transform:perspective(1200px) rotateY(-85deg);opacity:0}}
@keyframes gateOutNext{from{transform:none;opacity:1}to{transform:translateX(25%) scale(.92);opacity:0}}
@keyframes gateInPrev{from{transform:translateX(25%) scale(.92);opacity:0}to{transform:none;opacity:1}}

/* ---------- Mobile number lock ---------- */
.back-btn{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;background:#fff;border:0;color:var(--rb);cursor:pointer;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.back-btn:active{background:var(--rb-soft);transform:scale(.94)}
.back-btn svg{width:20px;height:20px}
.mobw{display:inline-flex;align-items:center;gap:8px}
.mob{font-weight:700;letter-spacing:.12em;cursor:pointer}
.eye{border:1px solid var(--line);background:var(--bg);color:var(--rb);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0}
.eye svg{width:18px;height:18px}
.pw{display:none;position:fixed;inset:0;z-index:120;background:rgba(7,20,45,.6);align-items:center;justify-content:center;padding:20px}
.pw.open{display:flex}
.pw-box{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:320px;box-shadow:0 16px 40px rgba(0,0,0,.35)}
.pw-box h3{font-size:1rem;color:var(--rb-dark)}
.pw-box p{font-size:.78rem;color:var(--dim);margin:4px 0 12px}
.pw-box input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;outline:none;background:var(--bg)}
.pw-box input:focus{border-color:var(--rb-mid)}
.pw-field{position:relative}
.pw-field input{padding-right:46px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:transparent;color:var(--rb);display:grid;place-items:center;cursor:pointer;border-radius:50%;padding:0}
.pw-eye:active{background:var(--rb-soft)}
.pw-eye svg{width:20px;height:20px}
.pw-err{min-height:18px;font-size:.78rem;color:#c62828;margin-top:6px;font-weight:600}
.pw-btns{display:flex;gap:8px;margin-top:6px}
.pw-btns button{flex:1;border-radius:10px;padding:11px;font-weight:700;font-size:.85rem;cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-family:inherit}
.pw-btns .pri{background:var(--rb);border-color:var(--rb);color:#fff}
</style>
</head>
<body>

<div id="gate">
  <canvas id="gCanvas"></canvas>
  <div class="g-in">
    <img class="g-logo" id="gLogo" alt="Indian Railways">
    <div class="g-rest">
      <div class="g-title">SOLAPUR DIVISION<br>QUARTER DETAILS</div>
      <div class="g-btns">
        <button type="button" data-sec="NORTH">NORTH</button>
        <button type="button" data-sec="SOUTH">SOUTH</button>
      </div>
    </div>
  </div>
</div>

<div class="pw" id="pw">
  <div class="pw-box">
    <h3>Enter password</h3>
    <p>Mobile numbers are protected.</p>
    <div class="pw-field"><input type="password" id="pwIn" placeholder="Password" autocomplete="off" /><button type="button" class="pw-eye" id="pwEye" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <div class="pw-err" id="pwErr"></div>
    <div class="pw-btns"><button type="button" id="pwCancel">Cancel</button><button type="button" class="pri" id="pwOk">Unlock</button></div>
  </div>
</div>

<div id="stage"><div id="app">
<header class="hero">
  <div class="hero-in">
    <div class="hero-row">

<script>
const ENDPOINT_URL = "https://script.google.com/macros/s/AKfycby1rZViYfAP9UlVifc2eKAx0VFaX2ehUGfZ-_SBq8H2jN4oiyB8kYg8qZTtcboXrAts5g/exec";
const AUTO_POLL_SEC = 60;
let records = [], all = [], selectedSr = null, statusFilter = "all";
let section = null, mobShownFor = null, pwCb = null;
const PW_B64 = "c3Nld29ya3NzdXI=";
// Stations of each section, in route order (station names as in the sheet).
const SECTIONS = {
  NORTH: ["BALE","PAKANI","MUNDHEWADI","MOHOL","MALIKPETH","ANGAR","VAKAV","MADHA","WADSINGE"],
  SOUTH: ["SOLAPUR","DUDHANI","BOROATI","NAGANSUR","AKKALKOT","TILATI","HOTGI","TIKEKARWADI"]
};
const HEAD = { NORTH: "(BALE TO WADSINGE)", SOUTH: "(SOLAPUR TO DUDHANI)" };
const stIndex=(name,sec)=>{
  const u=(name||"").trim().toUpperCase().replace(/\s+/g," ");
  return SECTIONS[sec].findIndex(n=>u===n||u.startsWith(n+" "));
};
function inSection(r){
  if(!section)return true;
  return stIndex(r.station,section)>=0;
}
const $ = id => document.getElementById(id);
const kTotal=$("kTotal"),kOcc=$("kOcc"),kVac=$("kVac"),
 qSearch=$("qSearch"),qStation=$("qStation"),qColony=$("qColony"),qFloor=$("qFloor"),
 blocksList=$("blocksList"),sheetBackdrop=$("sheetBackdrop"),detailSheet=$("detailSheet"),
 sTitle=$("sTitle"),sBadge=$("sBadge"),sBody=$("sBody");

const qDept=$("qDept"),qBldg=$("qBldg"),qType=$("qType"),qNo=$("qNo");
function openMobileSheet(){ sheetBackdrop.classList.add("open");detailSheet.classList.add("open");detailSheet.style.transform=""; $("sBody").scrollTop=0; }
function closeMobileSheet(){ sheetBackdrop.classList.remove("open");detailSheet.classList.remove("open");mobShownFor=null; }
sheetBackdrop.addEventListener("click", closeMobileSheet);
$("sClose").addEventListener("click", closeMobileSheet);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMobileSheet();});
// swipe down on the blue header to close
(()=>{let y0=null,dy=0;const top=$("sheetTop");
 top.addEventListener("touchstart",e=>{y0=e.touches[0].clientY;dy=0;detailSheet.style.transition="none";},{passive:true});
 top.addEventListener("touchmove",e=>{if(y0===null)return;dy=Math.max(0,e.touches[0].clientY-y0);detailSheet.style.transform=`translateY(${dy}px)`;},{passive:true});
 top.addEventListener("touchend",()=>{if(y0===null)return;detailSheet.style.transition="";detailSheet.style.transform="";if(dy>80)closeMobileSheet();y0=null;});
})();

function normalizeRecord(raw, idx){
  const pick=(...keys)=>{for(const k of keys){if(raw[k]!==undefined&&raw[k]!==null&&String(raw[k]).trim()!=="")return String(raw[k]).trim();}return "";};
  const stRaw=pick("status","Quarter Status","quarterStatus").toLowerCase();
  return {
    sr:Number(pick("sr","Sr. No.","srNo"))||(idx+1),
    name:pick("name","Employee Name","employeeName"),
    hrms:pick("hrms","HRMS ID","hrmsId"),
    mobile:pick("mobile","Mobile No.","mobileNo"),
    pf:pick("pf","PF No.","pfNo"),
    station:pick("station","Station"),
    colony:pick("colony","Colony"),
    dept:pick("dept","Department"),
    bldg:pick("bldg","Building No.","buildingNo"),
    qType:pick("qType","Quarter Type","quarterType"),
    qNo:pick("qNo","Quarter Number","quarterNo"),
    floor:pick("floor","Floor"),
    area:pick("area","Plinth Area (Sqm)","plinthArea"),
    status:stRaw.includes("vac")?"Vacant":"Occupied",
    date:pick("date","Occupied / Vacant Date","occVacDate"),
    remark:pick("remark","Remark")
  };
}

function floorRank(s){
  const f=(s||"").toLowerCase();
  if(f.includes("ground")||f==="g"||f==="gf")return 0;
  if(f.includes("1st")||f.includes("first")||f==="1")return 1;
  if(f.includes("2nd")||f.includes("second")||f==="2")return 2;
  if(f.includes("3rd")||f.includes("third")||f==="3")return 3;
  return 9;
}

function showErr(msg){
  let e=document.getElementById("errBar");
  if(!msg){if(e)e.remove();return;}
  if(!e){e=document.createElement("div");e.id="errBar";e.className="note err";blocksList.parentNode.insertBefore(e,blocksList);}
  e.textContent=msg;
}
async function fetchSheet(){
  try{
    showErr("");
    const res=await fetch(`${ENDPOINT_URL}?_=${Date.now()}`);
    if(!res.ok)throw new Error(`HTTP ${res.status}`);
    const data=await res.json();
    if(data.error)throw new Error(data.error);
    const list=Array.isArray(data)?data:(data.records||data.data||[]);
    all=list.map(normalizeRecord);
    records=all.filter(inSection);
    syncDropdowns();
    if(!records.some(x=>x.sr===selectedSr))selectedSr=records.length?records[0].sr:null;
    renderBoard();renderDetail();
  }catch(err){
    showErr(`Sync failed: ${err.message}. Check your connection and try again.`);
  }
}

const FILTERS=[
 {el:qStation,key:"station",all:"Stations",none:"Unspecified Station"},
 {el:qColony,key:"colony",all:"Colonies",none:"Unspecified Colony"},
 {el:qDept,key:"dept",all:"Departments",none:"Unspecified"},
 {el:qBldg,key:"bldg",all:"Buildings",none:"Unspecified"},
 {el:qType,key:"qType",all:"Quarter Types",none:"Unspecified"},
 {el:qNo,key:"qNo",all:"Quarter Nos.",none:"Unspecified"},
 {el:qFloor,key:"floor",all:"Floors",none:"Unspecified Floor"}
];
const fval=(r,f)=>r[f.key]||f.none;
const passes=(r,skip)=>FILTERS.every(f=>f===skip||f.el.value==="all"||fval(r,f)===f.el.value);

function syncDropdowns(){
  for(let pass=0;pass<3;pass++){
    let changed=false;
    for(const f of FILTERS){
      const prev=f.el.value,m=new Map();
      for(const r of records){if(!passes(r,f))continue;const v=fval(r,f);m.set(v,(m.get(v)||0)+1);}
      const keys=[...m.keys()].sort(f.key==="station"&&section?(a,b)=>stIndex(a,section)-stIndex(b,section):f.key==="floor"?(a,b)=>floorRank(a)-floorRank(b)||a.localeCompare(b):(a,b)=>a.localeCompare(b,undefined,{numeric:true}));
      f.el.innerHTML=`<option value="all">All ${f.all}</option>`+keys.map(k=>`<option value="${escAttr(k)}">${escHtml(k)}</option>`).join("");
      const next=m.has(prev)?prev:"all";
      f.el.value=next;
      if(next!==prev)changed=true;
    }
    if(!changed)break;
  }
}
const inLocation=r=>passes(r,null);
function matches(r){
  if(!inLocation(r))return false;
  if(statusFilter!=="all"&&r.status!==statusFilter)return false;
  const t=qSearch.value.trim().toLowerCase();
  if(!t)return true;
  return `${r.name} ${r.qNo} ${r.hrms} ${r.pf} ${r.dept} ${r.colony} ${r.station} ${r.bldg} ${r.floor}`.toLowerCase().includes(t);
}

function renderBoard(){
  const scoped=records.filter(inLocation);
  const occ=scoped.filter(r=>r.status==="Occupied").length;
  kTotal.textContent=scoped.length;kOcc.textContent=occ;kVac.textContent=scoped.length-occ;
  const filtered=records.filter(matches);
  if(!filtered.length){blocksList.innerHTML=`<div class="empty">No quarters match. Clear a filter or change the search.</div>`;return;}

  const groups=new Map();
  for(const r of filtered){
    const key=`${r.station}|${r.colony}|${r.bldg}`;
    if(!groups.has(key))groups.set(key,{station:r.station,colony:r.colony,bldg:r.bldg,items:[]});
    groups.get(key).items.push(r);
  }
  const frag=document.createDocumentFragment();
  groups.forEach(g=>{
    const gO=g.items.filter(x=>x.status==="Occupied").length;
    const card=document.createElement("section");
    card.className="bldg";
    card.innerHTML=`<div class="bh"><div style="min-width:0"><div class="bt">${escHtml(g.colony||"Colony")} · Bldg ${escHtml(g.bldg||"-")}</div><div class="bs">${escHtml(g.station||"Station")} · ${g.items.length} quarters</div></div><div class="bb"><span class="o">${gO} Occ</span><span class="v">${g.items.length-gO} Vac</span></div></div><div class="grid"></div>`;
    const grid=card.querySelector(".grid");
    g.items.forEach(r=>{
      const isO=r.status==="Occupied";
      const t=document.createElement("button");
      t.type="button";
      t.className=`tile ${isO?"occupied":"vacant"}${r.sr===selectedSr?" sel":""}`;
      t.innerHTML=`<div><div class="qn">Qtr ${escHtml(r.qNo||r.sr)}</div><div class="qf">${escHtml(r.floor||"-")} · ${escHtml(r.qType||"")}</div></div><div><div class="qp">${isO?escHtml(r.name||"Occupied"):"Vacant"}</div><div class="qd">${isO?escHtml(r.dept||"Occupied"):escHtml(r.dept||"Available")}</div></div>`;
      t.addEventListener("click",()=>{selectedSr=r.sr;renderBoard();renderDetail();openMobileSheet();});
      grid.appendChild(t);
    });
    frag.appendChild(card);
  });
  blocksList.innerHTML="";blocksList.appendChild(frag);
}

function renderDetail(){
  const r=records.find(x=>x.sr===selectedSr);
  if(!r)return;
  const isO=r.status==="Occupied";
  sTitle.textContent=`Quarter ${r.qNo||r.sr} (${r.qType||"Unit"})`;
  sBadge.textContent=r.status;
  sBadge.className=`badge ${isO?"occupied":"vacant"}`;
  $("sheetTop").className=`top ${isO?"occupied":"vacant"}`;
  detailSheet.classList.toggle("occupied",isO);detailSheet.classList.toggle("vacant",!isO);
  const mob=(r.mobile||"").trim();
  const hasMob=mob&&mob.toLowerCase()!=="nil"&&mob!=="—";
  const shown=mobShownFor===r.sr;
  const EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const EYE_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.1-5.9M9.9 4.2A10.7 10.7 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.2 3.2M1 1l22 22"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/></svg>';
  const mobHtml=!hasMob?"—":`<span class="mobw">${shown?`<a class="call" href="tel:${escAttr(mob.replace(/[^0-9+]/g,""))}">${escHtml(mob)}</a>`:`<span class="mob" id="mobVal">**********</span>`}<button type="button" class="eye" id="mobEye" aria-label="${shown?"Hide":"Show"} mobile number">${shown?EYE_OFF:EYE}</button></span>`;
  const pairs=[["Resident",escHtml(r.name||"—")],["Department",escHtml(r.dept||"—")],["Station",escHtml(r.station||"—")],["Colony",escHtml(r.colony||"—")],["Building No.",escHtml(r.bldg||"—")],["Floor",escHtml(r.floor||"—")],["Plinth Area",escHtml(r.area||"—")],["HRMS ID",escHtml(r.hrms||"—")],["PF No.",escHtml(r.pf||"—")],["Mobile No.",mobHtml],["Occ / Vac Date",escHtml(r.date||"—")],["Remark",escHtml(r.remark||"—")]];
  sBody.innerHTML=pairs.map(([k,v])=>`<div class="row"><span class="l">${escHtml(k)}</span><span class="r">${v}</span></div>`).join("");
}

function escHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function escAttr(s){return escHtml(s).replace(/'/g,"&#39;");}

FILTERS.forEach(f=>f.el.addEventListener("change",()=>{syncDropdowns();renderBoard();}));
qSearch.addEventListener("input",renderBoard);
document.querySelectorAll("#statusChips .chip").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("#statusChips .chip").forEach(c=>c.classList.remove("active"));
  b.classList.add("active");statusFilter=b.dataset.status;renderBoard();
}));


/* password prompt */
const PW_EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const PW_EYE_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.1-5.9M9.9 4.2A10.7 10.7 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.2 3.2M1 1l22 22"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/></svg>';
function setPwVisible(v){
  $("pwIn").type=v?"text":"password";
  $("pwEye").innerHTML=v?PW_EYE_OFF:PW_EYE;
  $("pwEye").setAttribute("aria-label",v?"Hide password":"Show password");
}
$("pwEye").addEventListener("mousedown",e=>e.preventDefault());
$("pwEye").addEventListener("click",()=>{setPwVisible($("pwIn").type==="password");$("pwIn").focus();});
function askPassword(cb){pwCb=cb;setPwVisible(false);$("pwIn").value="";$("pwErr").textContent="";$("pw").classList.add("open");setTimeout(()=>$("pwIn").focus(),60);}
function closePw(){$("pw").classList.remove("open");pwCb=null;}
function submitPw(){
  if($("pwIn").value===atob(PW_B64)){const cb=pwCb;closePw();if(cb)cb();}
  else{$("pwErr").textContent="Wrong password. Try again.";$("pwIn").select();}
}
$("pwOk").addEventListener("click",submitPw);
$("pwCancel").addEventListener("click",closePw);
$("pwIn").addEventListener("keydown",e=>{if(e.key==="Enter")submitPw();});
$("pw").addEventListener("click",e=>{if(e.target.id==="pw")closePw();});
sBody.addEventListener("click",e=>{
  if(e.target.closest("a"))return;
  if(!e.target.closest("#mobVal,#mobEye"))return;
  if(mobShownFor===selectedSr){mobShownFor=null;renderDetail();return;}
  const sr=selectedSr;
  askPassword(()=>{mobShownFor=sr;renderDetail();});
});

/* splash + NORTH / SOUTH gate */
$("gLogo").src=document.querySelector(".logo img").src;
const SPLASH_WAIT_MS = 1800;   // logo-only time before the title reveals (change here)
setTimeout(()=>{
  $("gate").classList.add("show-title");
  setTimeout(()=>$("gate").classList.add("ready"),900);
},SPLASH_WAIT_MS);
const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
let busy = false;
function runSwing(el, cleanup){
  let done=false;
  const finish=()=>{ if(done)return; done=true; cleanup(); busy=false; };
  el.addEventListener("animationend",finish,{once:true});
  setTimeout(finish,850);
}

/* ---------- pulsing grid dots behind the start screen ---------- */
const gcv=$("gCanvas"),gctx=gcv.getContext("2d");
let gW=0,gH=0,gDots=[],gTime=0,gRun=false;
const gPtr={x:-9999,y:-9999,a:false};
function gResize(){
  gW=innerWidth;gH=innerHeight;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  gcv.width=Math.floor(gW*dpr);gcv.height=Math.floor(gH*dpr);
  gctx.setTransform(dpr,0,0,dpr,0,0);
  const sp=gW<640?28:34,cols=Math.ceil(gW/sp)+1,rows=Math.ceil(gH/sp)+1;
  const ox=(gW-(cols-1)*sp)/2,oy=(gH-(rows-1)*sp)/2;
  gDots=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)gDots.push({x:ox+c*sp,y:oy+r*sp,c,r});
}
function gDraw(){
  gctx.clearRect(0,0,gW,gH);
  gTime+=0.035;
  for(const d of gDots){
    const wave=Math.sin(d.c*0.25+d.r*0.25-gTime);
    let rad=1.15+(wave+1)*0.55,al=0.16+(wave+1)*0.11;
    if(gPtr.a){
      const dist=Math.hypot(d.x-gPtr.x,d.y-gPtr.y);
      if(dist<145){const k=1-dist/145;rad+=k*2.3;al+=k*0.6;}
    }
    gctx.beginPath();gctx.arc(d.x,d.y,rad,0,Math.PI*2);
    gctx.fillStyle=`rgba(125,211,252,${Math.min(al,0.95)})`;gctx.fill();
  }
}
function gLoop(){ if(!gRun)return; gDraw(); requestAnimationFrame(gLoop); }
function startDots(){
  if(gRun)return;
  gResize();
  if(REDUCED){gDraw();return;}
  gRun=true;requestAnimationFrame(gLoop);
}
function stopDots(){gRun=false;}
window.addEventListener("resize",()=>{if(gRun||REDUCED){gResize();if(REDUCED)gDraw();}});
const gate0=$("gate");
const gSet=e=>{gPtr.x=e.clientX;gPtr.y=e.clientY;gPtr.a=true;};
gate0.addEventListener("pointerdown",gSet,{passive:true});
gate0.addEventListener("pointermove",gSet,{passive:true});
["pointerup","pointercancel","pointerleave"].forEach(ev=>gate0.addEventListener(ev,()=>{gPtr.a=false;}));
startDots();

/* forward: main screen swings open like a door over the gate */
function enterMain(){
  const gate=$("gate"),stage=$("stage");
  window.scrollTo(0,0);
  if(REDUCED){gate.classList.add("gone");stopDots();return;}
  busy=true;
  stage.classList.add("swinging","swing-in-next");
  gate.classList.add("swing-out-next");
  runSwing(stage,()=>{
    gate.classList.add("gone");stopDots();
    stage.classList.remove("swinging","swing-in-next");
    gate.classList.remove("swing-out-next");
  });
}
/* back: main screen swings shut, revealing the gate */
function showGate(){
  const gate=$("gate"),stage=$("stage"),app=$("app");
  if(busy||!gate.classList.contains("gone"))return;
  closeMobileSheet();
  gate.classList.add("show-title","ready");
  startDots();
  if(REDUCED){gate.classList.remove("gone");return;}
  busy=true;
  const sy=window.scrollY||0;
  app.style.marginTop=`-${sy}px`;
  stage.classList.add("swinging","swing-out-prev");
  gate.classList.remove("gone");
  gate.classList.add("swing-in-prev");
  runSwing(stage,()=>{
    stage.classList.remove("swinging","swing-out-prev");
    app.style.marginTop="";
    gate.classList.remove("swing-in-prev");
    window.scrollTo(0,sy);
  });
}
window.addEventListener("popstate",()=>{ if($("gate").classList.contains("gone"))showGate(); });
$("backBtn").addEventListener("click",showGate);
function chooseSection(sec){
  section=sec;
  $("secName").textContent=sec;
  $("hRoute").textContent=`SOLAPUR DIVISION QUARTER DETAILS ${HEAD[sec]}`;
  qSearch.value="";
  FILTERS.forEach(f=>f.el.value="all");
  statusFilter="all";
  document.querySelectorAll("#statusChips .chip").forEach(c=>c.classList.toggle("active",c.dataset.status==="all"));
  records=all.filter(inSection);
  syncDropdowns();
  selectedSr=records.length?records[0].sr:null;
  closeMobileSheet();
  renderBoard();renderDetail();
  enterMain();
  try{history.pushState({main:1},"");}catch(e){}
}
function triggerPulse(btn){btn.classList.remove("pulse");void btn.offsetWidth;btn.classList.add("pulse");}
let entering=false;
document.querySelectorAll("#gate [data-sec]").forEach(b=>b.addEventListener("click",()=>{
  if(entering||busy)return;
  entering=true;
  triggerPulse(b);
  setTimeout(()=>{entering=false;b.classList.remove("pulse");chooseSection(b.dataset.sec);},380);
}));
$("secBtn").addEventListener("click",showGate);

$("resetBtn").addEventListener("click",()=>{
  qSearch.value="";
  FILTERS.forEach(f=>f.el.value="all");
  statusFilter="all";
  document.querySelectorAll("#statusChips .chip").forEach(c=>c.classList.toggle("active",c.dataset.status==="all"));
  syncDropdowns();renderBoard();
});

fetchSheet();
setInterval(fetchSheet,AUTO_POLL_SEC*1000);
</script>
